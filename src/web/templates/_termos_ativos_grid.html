<div class="col-md-12">
    <div class="card">
        <div class="card-header"><h3 class="card-title">Termos Ativos</h3></div>
        <div class="card-body">
            <div class="mb-3 d-flex">
                <input id="new-term" class="form-control mr-2" placeholder="Novo termo" style="flex:1; margin-right:8px">
                <button class="btn btn-primary" id="btn-add-term">Incluir</button>
                <div style="margin-left:8px; display:flex; align-items:center;">
                   <label for="page-size-select" class="small mr-2" style="margin-bottom:0">Exibir:</label>
                   <select id="page-size-select" class="form-control form-control-sm" style="width:90px">
                       <option value="5">5</option>
                       <option value="10">10</option>
                       <option value="50">50</option>
                   </select>
               </div>
            </div>

            <table class="table table-sm" id="terms-table">
                <thead><tr><th>ID</th><th>Termo</th><th>Categoria</th><th>Ações</th></tr></thead>
                <tbody></tbody>
            </table>

            <div class="pagination-controls text-center mt-3">
                <button id="btn-prev-page" class="btn btn-outline-primary" disabled>Anterior</button>
                <span id="pagination-info" class="mx-3">Página 1 de 1</span>
                <button id="btn-next-page" class="btn btn-outline-primary" disabled>Próximo</button>
            </div>
         </div>
     </div>
 </div>

<!-- Toast container (necessário para exibir feedbacks do grid) -->
<div aria-live="polite" aria-atomic="true" style="position: fixed; top: 1rem; right: 1rem; z-index: 2000;">
   <div id="toast-container"></div>
</div>

<!-- Inclusões específicas usadas por este partial: Bootstrap/AdminLTE e o JS do grid -->
<!-- Bootstrap bundle (Popper + Bootstrap) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE (opcional para estilos e comportamentos do tema) -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<!-- Lógica do grid (carregado por este partial) -->
<script src="/static/js/termos_ativos.js"></script>
