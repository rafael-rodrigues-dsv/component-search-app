<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração - Python Search App</title>
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <!-- Chart.js (carregado no dashboard também, compatível) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS (padronizar com dashboard) -->
    <style>
        .content-wrapper { margin-left: 0 !important; }
        .main-sidebar { display: none; }
        .navbar-nav .nav-link { color: #fff !important; }
        .navbar-dark { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; }
        .small-box { border-radius: 10px; }
        .card { border-radius: 10px; }
        .progress { height: 8px; }
        .info-box { border-radius: 10px; }
        .term-tag {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            margin-right: 6px;
            margin-bottom: 6px;
            background: #007bff;
            color: #fff;
            position: relative;
        }
        .term-tag .delete-tag {
            margin-left: 8px;
            color: rgba(255,255,255,0.9);
            cursor: pointer;
        }
    </style>
</head>
<body class="hold-transition layout-top-nav">
<div class="wrapper">
    {% include '_menu.html' %}

    <div class="content-wrapper">
        <div class="content-header">
            <div class="container">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h2 class="m-0">Configuração</h2>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item active">Configuração</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container">
                <div class="row">
                    {% include '_termos_ativos_grid.html' %}
                </div>
            </div>
        </section>
     </div>
 </div>
