<div>
  <h3>Define o CEP</h3>
  <p class="text-muted">Digite o CEP que será usado no processamento de municípios/bairros (POC).</p>

  <div class="form-inline">
    <input id="cepInput" class="form-control mr-2" placeholder="Digite CEP" />
    <label for="cepRaioInput" class="ml-2 mr-1">Raio (km):</label>
    <input id="cepRaioInput" type="number" min="1" step="1" class="form-control mr-2" style="width:100px" placeholder="km" />
    <button id="saveCep" class="btn btn-primary btn-sm">Salvar</button>
  </div>

  <div class="mt-3">
    <div><strong>CEP atual:</strong> <span id="cepCurrent">(nenhum)</span></div>
    <div><strong>Cidade:</strong> <span id="cepCidade">-</span></div>
    <div><strong>Estado:</strong> <span id="cepEstado">-</span></div>
    <div><strong>Logradouro:</strong> <span id="cepLogradouro">-</span></div>
    <div><strong>Raio (km):</strong> <span id="cepRaioCurrent">-</span></div>
  </div>
</div>

<!-- Confirmation modal (Bootstrap) -->
<div class="modal fade" id="cepConfirmModal" tabindex="-1" role="dialog" aria-labelledby="cepConfirmModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="cepConfirmModalLabel">Confirme o endereço</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p id="cepConfirmText">Carregando...</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
        <button type="button" id="cepConfirmBtn" class="btn btn-primary">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/workflow/workflow_step_zip_code.js"></script>
