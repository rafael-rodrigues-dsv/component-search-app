<div class="col-md-12">
    <div class="card">
        <div class="card-header"><h3 class="card-title">Termos</h3></div>
        <div class="card-body">
            <div class="mb-3 d-flex">
                <div style="margin-left:auto; display:flex; align-items:center;">
                   <label for="page-size-select" class="small mr-2" style="margin-bottom:0">Exibir:</label>
                   <select id="page-size-select" class="form-control form-control-sm" style="width:90px">
                       <option value="5">5</option>
                       <option value="10">10</option>
                       <option value="50">50</option>
                       <option value="100">100</option>
                   </select>
               </div>
            </div>

            <table class="table table-sm" id="terms-table">
                <thead><tr><th>ID</th><th>Termo</th><th>Categoria</th><th>Ações</th></tr></thead>
                <tbody>
                  <tr id="terms-new-row" style="display:none;">
                    <td></td>
                    <td><input id="row-new-term" class="form-control form-control-sm" placeholder="Novo termo"></td>
                    <td><input id="row-new-term-category" class="form-control form-control-sm" placeholder="Categoria (livre)"></td>
                    <td>
                      <div class="btn-group btn-group-sm" role="group">
                        <button id="btn-add-term" class="btn btn-primary">OK</button>
                        <button id="btn-cancel-term" class="btn btn-outline-secondary">X</button>
                      </div>
                    </td>
                  </tr>
                </tbody>
            </table>

            <!-- Botão + (mantido) -->
            <div class="mt-2 text-right">
                <button id="btn-open-term-editor" class="btn btn-success btn-sm"><i class="fas fa-plus"></i> Adicionar</button>
            </div>

            <!-- editor agora é a linha da tabela (terms-new-row) -->

            <div class="pagination-controls text-center mt-3">
                <button id="btn-prev-page" class="btn btn-outline-primary" disabled>Anterior</button>
                <span id="pagination-info" class="mx-3">Página 1 de 1</span>
                <button id="btn-next-page" class="btn btn-outline-primary" disabled>Próximo</button>
            </div>
         </div>
     </div>
 </div>

<!-- Toast container (necessário para exibir feedbacks do grid) -->
<div aria-live="polite" aria-atomic="true" style="position: fixed; top: 1rem; right: 1rem; z-index: 2000;">
   <div id="toast-container"></div>
</div>

<!-- Lógica do grid (carregado por este partial) -->
<script src="/static/js/workflow/workflow_step_terms.js"></script>
